<style>
    .tab-container input[type="radio"] {
        display: none;
    }
    
    /* Tabs */
    .tab-labels {
        display: flex;
        border-bottom: 2px solid #ddd;
    }
    
    .tab-labels label {
        padding: 10px 20px;
        cursor: pointer;
        font-weight: 600;
        color: #555;
    }
    
    /* Active tab */
    #tab1:checked ~ .tab-labels label[for="tab1"],
    #tab2:checked ~ .tab-labels label[for="tab2"] {
        background: #128cff;
        color: #fff;
        border-radius: 6px;
    }
    
    /* Hide all content */
    .tab-content {
        display: none;
    }
    
    /* Show active content */
    #tab1:checked ~ #content1,
    #tab2:checked ~ #content2 {
        display: block;
    }
    </style>
    
    <div class="tab-container">
